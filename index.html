  <style>
    body {
      font-family: 'Plus Jakarta Sans', 'Noto Serif Tamil', sans-serif;
      background-color: #FFF8EE;
      background-image:
        radial-gradient(circle at 15% 15%, rgba(251, 146, 60, 0.12), transparent 35%),
        radial-gradient(circle at 85% 30%, rgba(220, 38, 38, 0.08), transparent 40%),
        radial-gradient(#D9770618 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 26px 26px;
    }
    .font-display { font-family: 'Cinzel Decorative', 'Cinzel', 'Noto Serif Tamil', serif; }
    .font-heritage { font-family: 'Cinzel', 'Noto Serif Tamil', serif; }
    .font-tamil { font-family: 'Noto Serif Tamil', serif; }
    .font-sanskrit { font-family: 'Noto Sans Devanagari', serif; }

    @keyframes spinSlow {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes spinReverse {
      from { transform: rotate(360deg); }
      to { transform: rotate(0deg); }
    }
    @keyframes pulseGlow {
      0%, 100% { filter: drop-shadow(0 0 10px rgba(251, 191, 36, 0.55)); transform: scale(1); }
      50% { filter: drop-shadow(0 0 22px rgba(251, 191, 36, 0.9)); transform: scale(1.04); }
    }
    .animate-mandala { animation: spinSlow 45s linear infinite; }
    .animate-mandala-rev { animation: spinReverse 60s linear infinite; }
    .animate-thiruman { animation: pulseGlow 4s ease-in-out infinite; }

    .card-lift {
      transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.35s ease, border-color 0.35s ease;
    }
    .card-lift:hover {
      transform: translateY(-4px);
      box-shadow: 0 14px 30px -10px rgba(154, 52, 18, 0.18);
    }

    .reveal {
      opacity: 0;
      transform: translateY(22px);
      transition: opacity 0.7s cubic-bezier(0.16, 1, 0.3, 1), transform 0.7s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .reveal.in-view {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>
